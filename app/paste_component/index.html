<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #cbd5e1;
        background: transparent;
      }
      #dropzone {
        box-sizing: border-box;
        width: 100%;
        min-height: 72px;
        border: 1px dashed rgba(148, 163, 184, 0.65);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 12px;
        outline: none;
        background: rgba(15, 23, 42, 0.32);
        cursor: text;
      }
      #dropzone:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.18);
      }
      #status {
        margin-top: 6px;
        min-height: 18px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="dropzone" tabindex="0">Click vào đây rồi nhấn Ctrl+V để dán ảnh</div>
    <div id="status"></div>
    <script>
      const zone = document.getElementById("dropzone");
      const status = document.getElementById("status");

      function sendValue(value) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value,
          },
          "*"
        );
      }

      function setReady() {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1,
          },
          "*"
        );
      }

      function setFrameHeight() {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height: document.body.scrollHeight,
          },
          "*"
        );
      }

      zone.addEventListener("paste", (event) => {
        const items = event.clipboardData && event.clipboardData.items;
        if (!items) return;

        for (const item of items) {
          if (item.type && item.type.startsWith("image/")) {
            event.preventDefault();
            const file = item.getAsFile();
            const reader = new FileReader();
            reader.onload = () => {
              status.textContent = "Đã nhận ảnh từ clipboard.";
              sendValue({
                name: "clipboard_image.png",
                type: file.type || "image/png",
                data_url: reader.result,
              });
              setFrameHeight();
            };
            reader.readAsDataURL(file);
            return;
          }
        }
        status.textContent = "Clipboard không có ảnh. Hãy copy trực tiếp ảnh rồi dán lại.";
        setFrameHeight();
      });

      zone.addEventListener("click", () => zone.focus());
      setReady();
      setFrameHeight();
    </script>
  </body>
</html>
