stages:
  data_collection:
    cmd: python scripts/data/download_datasets.py
    deps:
      - scripts/data/download_datasets.py
    outs:
      - data/raw
  
  preprocessing:
    cmd: python scripts/data/extract_frames.py && python scripts/data/detect_faces.py && python scripts/data/split_dataset.py
    deps:
      - data/raw
      - scripts/data/extract_frames.py
      - scripts/data/detect_faces.py
      - scripts/data/split_dataset.py
      - src/data/transforms.py
    outs:
      - data/faces
      - data/metadata/train.csv
      - data/metadata/val.csv
      - data/metadata/test.csv

  training:
    cmd: python scripts/train.py --config configs/base.yaml
    deps:
      - data/faces
      - data/metadata/train.csv
      - data/metadata/val.csv
      - configs/base.yaml
      - scripts/train.py
      - src/models
      - src/training
    outs:
      - models/checkpoints/best_model.pth

  evaluation:
    cmd: python scripts/evaluate.py --checkpoint models/checkpoints/best_model.pth --test-csv data/metadata/test.csv
    deps:
      - models/checkpoints/best_model.pth
      - data/metadata/test.csv
      - scripts/evaluate.py
    outs:
      - reports/evaluation/evaluation_report.pdf
      - reports/evaluation/predictions.csv
