services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepguard-api:latest
    container_name: deepguard-api
    ports:
      - "8000:8000"
    environment:
      CONFIG_PATH: configs/base.yaml
      MODEL_CHECKPOINT_PATH: models/checkpoints/best_model.pth
      DEVICE: cpu
      AUTO_CPU_OPTIMIZATIONS: "true"
      FACE_DETECTOR_BACKEND: insightface
      INFERENCE_TTA: adaptive
      INFERENCE_BATCH_SIZE: 4
      VIDEO_CHUNK_SIZE: 16
      MAX_VIDEO_JOBS: 1
      OMP_NUM_THREADS: 8
      MKL_NUM_THREADS: 8
      LOG_LEVEL: INFO
      LOG_ROTATION: 100 MB
      LOG_RETENTION: 14 days
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - insightface-cache:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: deepguard-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    container_name: deepguard-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  insightface-cache:
  prometheus-data:
  grafana-data:
