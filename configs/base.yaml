# ============================================================
# DeepGuard — Base Configuration
# ============================================================

# --- Model ---
backbone: efficientnet_b4
num_classes: 1
dropout_rate: 0.3
pretrained: true
image_size: 224
threshold: 0.75

# --- Training ---
seed: 42
num_epochs: 30
warmup_epochs: 5
batch_size: 32
learning_rate: 1.0e-4
weight_decay: 1.0e-5
min_lr: 1.0e-6
grad_clip: 1.0
early_stopping_patience: 7
save_every: 5

# --- Data ---
data_root: ./data
train_csv: data/metadata/train.csv
val_csv: data/metadata/val.csv
test_csv: data/metadata/test.csv
num_workers: 4
n_frames: 16

# --- Augmentation ---
augment_level: medium            # light | medium | heavy
jpeg_quality_lower: 60
jpeg_quality_upper: 100
coarse_dropout_holes: 8
coarse_dropout_size: 32

# --- Class Balancing ---
use_weighted_sampler: true       # WeightedRandomSampler in DataLoader

# --- Loss ---
loss_type: focal
focal_alpha: 0.25
focal_gamma: 2.0

# --- Inference ---
checkpoint_path: models/checkpoints/best_model.pth
video_aggregation: mean
inference_tta: adaptive           # false | true | adaptive. Request use_tta overrides this.
threshold_config_path: configs/thresholds.yaml

# Face detector backend:
# - mtcnn: facenet-pytorch MTCNN, accurate but slower on CPU
# - insightface: faster ONNXRuntime detector; first startup may download ~90MB model cache
# - haar: lightweight OpenCV fallback, least accurate
# - auto: try insightface, then mtcnn, then haar
face_detector_backend: insightface

# Inference throughput controls. Leave inference_batch_size null for automatic
# CPU/GPU batch sizing; CPU defaults to a small batch to avoid RAM spikes.
inference_batch_size: 4
inference_amp: false             # Optional CUDA autocast for inference. Keep false unless validated.
video_chunk_size: 16              # Number of sampled face crops predicted per video chunk
face_batch_size: 8                # Number of frames sent to face detection per chunk
face_cache_gap: 5                 # Reuse last face box for at most this many frame indices
adaptive_tta_threshold_low: 0.4   # Low-confidence band lower bound
adaptive_tta_threshold_high: 0.6  # Low-confidence band upper bound
auto_cpu_optimizations: true      # Apply CPU-safe inference defaults when CUDA is unavailable
cpu_inference_batch_size: 4
cpu_image_size: 224
cpu_video_chunk_size: 16
cpu_max_threads:
cpu_disable_tta_load_percent: 85.0

# --- MLflow ---
mlflow_tracking_uri: http://localhost:5000
mlflow_experiment_name: deepguard-experiments

# --- API ---
api_host: 0.0.0.0
api_port: 8000
max_upload_size_mb: 100
