# ============================================================
# DeepGuard — EfficientNet-B4 Configuration
# Optimized hyperparameters for EfficientNet-B4 backbone
# ============================================================

# Inherit base config defaults, then override below:
backbone: efficientnet_b4
image_size: 224
dropout_rate: 0.4

# Tuned training params
num_epochs: 30
batch_size: 32
learning_rate: 5.0e-5          # Fine-tuning LR (lower than base)
weight_decay: 1.0e-5
min_lr: 1.0e-7
grad_clip: 1.0
early_stopping_patience: 8
save_every: 5

# Loss
loss_type: focal
focal_alpha: 0.25
focal_gamma: 2.0

# Data
num_workers: 4
train_csv: data/metadata/train.csv
val_csv: data/metadata/val.csv
test_csv: data/metadata/test.csv

# MLflow
mlflow_experiment_name: deepguard-efficientnet-b4
