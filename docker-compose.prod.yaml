services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepguard-api:prod
    restart: unless-stopped
    environment:
      CONFIG_PATH: configs/base.yaml
      MODEL_CHECKPOINT_PATH: models/checkpoints/best_model.pth
      DEVICE: cuda
      FACE_DETECTOR_BACKEND: insightface
      INFERENCE_TTA: adaptive
      INFERENCE_BATCH_SIZE: 32
      VIDEO_CHUNK_SIZE: 32
      FACE_BATCH_SIZE: 8
      MAX_VIDEO_JOBS: 2
      LOG_LEVEL: INFO
      LOG_ROTATION: 100 MB
      LOG_RETENTION: 14 days
      API_HOST: 0.0.0.0
      API_PORT: 8000
    expose:
      - "8000"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - insightface-cache:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.3
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  insightface-cache:
  prometheus-data:
  grafana-data:
